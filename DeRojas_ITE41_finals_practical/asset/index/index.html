<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="C:\Users\ADMIN\Downloads\asset-20251115T074432Z-1-001\asset\styles\style.css">
     
     <script src="C:\Users\ADMIN\Downloads\asset-20251115T074432Z-1-001\asset\scripts\script.js" defer></script> 
  </head>

<body>

    <div class="form-container">

      <h2>Register</h2>



      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="input-name" name="name" placeholder="Full Name" />
        </div>



        <div class="input-group">
          <input type="email" name="email" placeholder="Email Address" />
        </div>



        <div class="input-group">
          <input type="password" name="password" placeholder="Password" />
        </div>



        <button type="submit" class="btn-submit">Sign Up</button>
      </form>

      <div class="success-message" id="successMessage">Registration Successful 🎉</div>
    </div>

  </body>

</html>
