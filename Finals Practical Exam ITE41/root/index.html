<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="asset/styles/style.css">
</head>
<body>
<div class="form-container">
  <h2>Register</h2>
  <div class="input-group" id="fullNameGroup">
    <input type="text" id="fullName" placeholder="Full Name">
    <div class="error-msg" id="fullNameError"></div>
      <div id="genderContainer"></div>
  </div>

  <div class="input-group">
    <input type="email" name="email" placeholder="Email Address">
      <div class="error-msg" id="emailError"></div>
  </div>

  <div class="input-group">
    <div class="input-wrapper">
      <input type="password" name="password" placeholder="Password">
        <div class="eye" id="passwordEye">👁</div>
    </div>
      <div class="error-msg" id="passwordError"></div>
  </div>

  <div class="input-group">
      <div class="input-wrapper">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" style="display:none;">
        <div class="eye" id="confirmEye" style="display:none;">👁</div>
    </div>
    <div class="error-msg" id="confirmError"></div>
  </div>

    <button type="submit" class="btn-submit">Sign Up</button>
  <div class="success-message" id="successMessage">Registration Successful 🎉</div>
</div>
<script src="asset/scripts/script.js"></script>
</body>
</html>
