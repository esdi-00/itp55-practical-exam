<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="asset/styles/style.css">
  </head>

  <body>
    <div class="form-container">
      <h2>Register</h2>
      <div class="input-group">
        <input id="nameinput" type="text" name="name" placeholder="Full Name"/>
      </div>
      <div class = "input-group" id="dropdown-container"></div>
      <div class="input-group">
        <input id = "email" type="email" name="email" placeholder="Email Address"/>
      </div>
      <div class="input-group">
        <input id ="passwordinput" type="password" name="password" placeholder="Password"/>
      </div>
      <div class = "input-group" id="password-container"></div>
      <button type="submit" class="btn-submit">Sign Up</button>
      <div class="success-message" id="successMessage">Registration Successful 🎉</div>
    </div>
    <script src="asset\scripts\script.js"></script>
  </body>
</html>
