<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="asset/styles/style.css">
    <script defer src="asset\scripts\script.js"></script>
  </head>

  <body>
    
    <div class="form-container">

        <h2>Register</h2>

        <div class="input-group" >

          <input id="fullname" type="text" name="name"  placeholder="Full Name"/>
        
        </div>

        <div class="input-group">

          <input id="emailField" type="email" name="email" placeholder="Email Address"/>
        
        </div>

        <div class="input-group">

          <input type="password" name="password" id="password" placeholder="Password"/>
        
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>

        <div class="success-message" id="successMessage">Registration Successful 🎉</div>
    
    </div>

  </body>
</html>
