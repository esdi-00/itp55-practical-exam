<!DOCTYPE html>
<html>
    <head>
        <title>My Website</title>
        <link rel="stylesheet" href="assets\styles\style.css">
    </head>

    <body>
        <div>
            <form action="#">
                <h2>Login Form</h2>
                <div class="input-field">
                    <input type="text" required class="inputbox" placeholder=" ">
                    <label class="inputlabel"> Enter your email</label>
                </div>
                <div class="input-field">
                    <input type="password" required class="inputbox"  placeholder=" ">
                    <label class="inputlabel"> Enter your password</label>
                </div>
                <div class="forget">
                    <label for="remember" class="rememberme">
                        <input type="checkbox" id="remember">
                        <p>Remember me</p>
                    </label>
                    <a href="#">Forgot Password</a>
                </div>
                <button type="submit">Login</button>
                <div class="register">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </body>
</html>
